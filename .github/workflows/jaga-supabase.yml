# Penjaga project Supabase paket gratis Petualangan (gwanpjezsokmxulebing).
# Supabase mem-pause project gratis yang 7 hari tanpa permintaan. Tugas ini memanggil pts_ping
# (tidak membaca data apa pun) setiap 3 hari. Kuncinya kunci publik yang sama dengan config.js.
# Bila gagal (project terlanjur di-pause), GitHub mengirim email → buka dashboard Supabase, Restore.
# Bila GitHub menghentikan tugas terjadwal: tab Actions → "Jaga Supabase" → Enable workflow.

name: Jaga Supabase

on:
  schedule:
    - cron: "23 0 */3 * *"   # tiap 3 hari, 07.23 WIB
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping project Petualangan
        run: |
          kode=$(curl -s -o /tmp/balasan -w "%{http_code}" --max-time 30 -X POST \
            "https://gwanpjezsokmxulebing.supabase.co/rest/v1/rpc/pts_ping" \
            -H "apikey: sb_publishable_aVTRyqibGK2VbKOLMtERQA_mmOR26uI" -H "Content-Type: application/json" -d '{}')
          if [ "$kode" -ge 200 ] && [ "$kode" -lt 300 ]; then echo "✓ $kode $(cat /tmp/balasan)"
          else echo "::error::Ping gagal ($kode): $(head -c 300 /tmp/balasan) — cek dashboard Supabase (Restore)"; exit 1; fi
